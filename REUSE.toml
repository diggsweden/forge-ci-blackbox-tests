version = 1

[[annotations]]
path = "**/*.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 Digg - Agency for Digital Government"
SPDX-License-Identifier = "CC0-1.0"

# Go module metadata. Generated by the toolchain and comment-free, so the
# licensing lives here rather than in a header.
[[annotations]]
path = ["go.mod", "go.sum"]
SPDX-FileCopyrightText = "2026 Digg - Agency for Digital Government"
SPDX-License-Identifier = "CC0-1.0"

# ---------------------------------------------------------------------------
# Ecosystem fixtures
#
# Every fixture is a minimal throwaway project written for this suite. They
# are CC0 so that an adopter can lift one as a starting point without taking
# on an obligation. Most are manifest formats with no comment syntax that the
# ecosystem's tooling tolerates (JSON), or lockfiles a tool rewrites, so the
# annotation lives here instead of in the file.
# ---------------------------------------------------------------------------

[[annotations]]
path = [
  "fixtures/android-library/**",
  "fixtures/gradle-library/**",
  "fixtures/gradle-multi-library/**",
  "fixtures/maven-central-snapshot/**",
  "fixtures/maven-snapshot-guard/**",
  "fixtures/maven-environment-profile/**",
  "fixtures/maven-profile-metadata/**",
  "fixtures/cargo-hello/**",
  "fixtures/cargo-workspace/**",
  "fixtures/go-hello/**",
  "fixtures/gradle-android-hello/**",
  "fixtures/maven-hello/**",
  "fixtures/maven-lib/**",
  "fixtures/maven-multi/**",
  "fixtures/npm-app/**",
  "fixtures/npm-lib/**",
]
SPDX-FileCopyrightText = "2026 Digg - Agency for Digital Government"
SPDX-License-Identifier = "CC0-1.0"

# gradle-hello is split: the project sources are ours, the wrapper is not.
[[annotations]]
path = [
  "fixtures/gradle-hello/build.gradle",
  "fixtures/gradle-hello/gradle.properties",
  "fixtures/gradle-hello/gradle/wrapper/gradle-wrapper.jar.sha256",
  "fixtures/gradle-hello/settings.gradle",
  "fixtures/gradle-hello/src/**",
]
SPDX-FileCopyrightText = "2026 Digg - Agency for Digital Government"
SPDX-License-Identifier = "CC0-1.0"

# The Gradle wrapper is vendored third-party material, not ours to relicense.
# gradlew and gradlew.bat already carry their own Apache-2.0 headers; the jar
# is a binary and the properties file is generated, so both are annotated.
[[annotations]]
path = [
  "fixtures/gradle-hello/gradle/wrapper/gradle-wrapper.jar",
  "fixtures/gradle-hello/gradle/wrapper/gradle-wrapper.properties",
]
SPDX-FileCopyrightText = "Gradle Inc."
SPDX-License-Identifier = "Apache-2.0"
