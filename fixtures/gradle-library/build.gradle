plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'se.digg.test'

java {
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        library(MavenPublication) {
            from components.java
            pom {
                name = 'Gradle publication fixture'
                description = 'A disposable reference consumer'
                url = 'https://example.invalid/library'
                licenses {
                    license {
                        name = 'CC0'
                        url = 'https://creativecommons.org/publicdomain/zero/1.0/'
                    }
                }
                developers {
                    developer { id = 'fixture'; name = 'Fixture' }
                }
                scm { url = 'https://example.invalid/library.git' }
            }
        }
    }
}
