plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'demo.fixture'
    compileSdk 35
    buildToolsVersion '35.0.0'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 23
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            library(MavenPublication) {
                from components.release
                artifactId = 'android-library-fixture'

                pom {
                    name = 'Android library fixture'
                    description = 'Disposable SDK build and publication fixture'
                    url = 'https://example.invalid/library'
                    licenses {
                        license {
                            name = 'CC0'
                            url = 'https://creativecommons.org/publicdomain/zero/1.0/'
                        }
                    }
                    developers {
                        developer { id = 'fixture' }
                    }
                    scm { url = 'https://example.invalid/library.git' }
                }
            }
        }
    }
}
